<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhatti Petroleum - System Login</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        :root {
            --primary: #1a2a6c;
            --primary-dark: #0d1840;
            --accent: #b21f1f;
            --accent-light: #fdbb2d;
            --bg-card: #ffffff;
            --text-main: #37474f;
            --text-muted: #7f8c8d;
            --border-color: #b0bec5;
            --error-bg: #fce4e4;
            --error-text: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 15px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--accent-light));
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 20px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 11px;
            opacity: 0.9;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .login-body {
            padding: 28px 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #fafafa;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 5px;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .btn-login:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .error-msg {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
            display: none;
            border: 1px solid rgba(192, 57, 43, 0.2);
        }

        .login-footer {
            background-color: #f8fafc;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid #e2e8f0;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #2ec4b6;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
    </style>
</head>

<body>

    <main class="login-card">
        <header class="login-header">
            <h2>⛽ Bhatti Petroleum</h2>
            <p>BHOBRA - Integrated Management System v2.0</p>
        </header>

        <section class="login-body">
            <div id="errorAlert" class="error-msg" role="alert" aria-live="assertive">Incorrect Username or Password!</div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="username">Username / ID</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" id="submitBtn" class="btn-login">Login to Dashboard</button>
            </form>
        </section>

        <footer class="login-footer">
            Authorized Personnel Only &bull; <span class="status-dot"></span> System Status: Online
        </footer>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Authenticating...';

            try {
                // Verified active endpoint
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.status === "Success") {
                    localStorage.setItem('userId', data.user.id);
                    
                    if (data.user.name) {
                        localStorage.setItem('username', data.user.name);
                    }
                    if (data.user.role) {
                        localStorage.setItem('userRole', data.user.role);
                    }

                    window.location.href = 'dashboard.html';
                } else {
                    errorAlert.innerText = data.message || "Invalid credentials!";
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                console.error("Login Error:", err);
                errorAlert.innerText = "Server Connection Failed!";
                errorAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login to Dashboard';
            }
        });
    </script>

</body>

</html>
